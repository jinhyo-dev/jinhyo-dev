# Regenerates profile-3d-contrib/profile-{light,dark}.svg (theme: .github/profile-3d-settings.json).
# Local run (needs Node 22+, a GitHub token, and a checkout of yoshi389111/github-profile-3d-contrib):
#   GITHUB_TOKEN=$(gh auth token) SETTING_JSON=.github/profile-3d-settings.json node <checkout>/dist/index.js jinhyo-dev
# Pass the username as an argument — in zsh, `USERNAME=... cmd` is silently ignored (USERNAME is a special shell parameter).
name: Profile 3D contribution graph

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 KST, daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d
  cancel-in-progress: true

jobs:
  generate:
    name: Generate profile-3d-contrib/*.svg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Render 3D contribution graph (light + dark)
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-settings.json

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          if git commit -m "chore: refresh 3D contribution graph"; then
            git push
          else
            echo "No changes."
          fi
